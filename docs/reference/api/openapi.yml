openapi: 3.1.0
info:
  title: Hekatoncheiros Core API
  version: "0.1.1"
  description: >
    Core platform kernel API (draft). Versioned under /api/v1.
    Requests are tenant-contextual and privilege-checked by the core.

servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: localhost

tags:
  - name: Auth
  - name: Context
  - name: Licensing
  - name: Apps
  - name: Events
  - name: Audit

paths:
  /.well-known/hc/app-catalog.json:
    get:
      tags: [Apps]
      summary: Public application catalog feed exported by this instance.
      operationId: getPublicAppCatalogFeed
      responses:
        "200":
          description: Public app catalog feed

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user and issue access + refresh tokens.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, expires_at]
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  refresh_expires_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Issue a new access token from a refresh token.
      operationId: refreshUserSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Access token refreshed
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_at]
                properties:
                  access_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"

  /context:
    get:
      tags: [Context]
      summary: Get resolved request context for the current actor and tenant.
      operationId: getContext
      security:
        - bearerAuthUser: []
      x-required-privileges: [] # authenticated user only
      responses:
        "200":
          description: Context resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /licensing/apps/{app_id}:
    get:
      tags: [Licensing]
      summary: Deprecated in favor of /licensing/entitlements and /apps/{slug}/entitlement.
      operationId: deprecatedGetAppLicense
      deprecated: true
      responses:
        "410":
          description: Endpoint removed in entitlements model.

  /licensing/apps/{app_id}/activate-offline:
    post:
      tags: [Licensing]
      summary: Deprecated in favor of /licensing/offline.
      operationId: deprecatedActivateOfflineLicense
      deprecated: true
      responses:
        "410":
          description: Endpoint removed in entitlements model.

  /licensing/entitlements:
    get:
      tags: [Licensing]
      summary: List tenant entitlements for one app, including selected entitlement id.
      operationId: listEntitlements
      parameters:
        - name: app_id
          in: query
          required: true
          schema:
            type: string
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "core.licensing.read"
      responses:
        "200":
          description: Entitlements list
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /licensing/selection:
    post:
      tags: [Licensing]
      summary: Set explicit selected entitlement for tenant/app.
      operationId: setEntitlementSelection
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "core.licensing.manage_selection"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, entitlement_id]
              properties:
                app_id:
                  type: string
                entitlement_id:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Selection set
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /licensing/selection/clear:
    post:
      tags: [Licensing]
      summary: Clear explicit selection for tenant/app.
      operationId: clearEntitlementSelection
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "core.licensing.manage_selection"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id]
              properties:
                app_id:
                  type: string
      responses:
        "204":
          description: Selection cleared
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /licensing/offline:
    post:
      tags: [Licensing]
      summary: Ingest and verify offline entitlement token (JWS/JWT).
      operationId: ingestOfflineEntitlement
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "core.licensing.ingest_offline"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Token ingested
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /apps/registry:
    get:
      tags: [Apps]
      summary: List visible apps (installed + resolved entitlement + privileges).
      operationId: listVisibleAppRegistry
      security:
        - bearerAuthUser: []
      responses:
        "200":
          description: Registry items

  /apps/installed:
    get:
      tags: [Apps]
      summary: List installed apps with resolved entitlement and has_any_entitlement flag.
      operationId: listInstalledAppsWithEntitlements
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "platform.apps.manage"
      responses:
        "200":
          description: Installed app list

  /apps/catalog:
    get:
      tags: [Apps]
      summary: List local application catalog entries.
      operationId: listAppCatalog
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "platform.apps.manage"
      responses:
        "200":
          description: Catalog entries with install/license state
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /apps/catalog/entries/from-manifest:
    post:
      tags: [Apps]
      summary: Create or refresh a catalog entry from an app manifest base URL.
      operationId: createCatalogEntryFromManifest
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "platform.apps.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url]
              properties:
                base_url:
                  type: string
                  format: uri
                summary:
                  type: string
                  nullable: true
                trust_status:
                  type: string
                  enum: [dev, manual, unverified]
      responses:
        "201":
          description: Catalog entry
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /apps/catalog/sources:
    get:
      tags: [Apps]
      summary: List application catalog feed sources.
      operationId: listAppCatalogSources
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "platform.apps.manage"
      responses:
        "200":
          description: Catalog feed source list
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Apps]
      summary: Create or re-enable a catalog feed source.
      operationId: createAppCatalogSource
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "platform.apps.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, feed_url]
              properties:
                name:
                  type: string
                feed_url:
                  type: string
                  format: uri
                trust_mode:
                  type: string
                  enum: [dev, manual, verified, official]
                  default: manual
      responses:
        "201":
          description: Catalog feed source
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /apps/catalog/sources/{id}:
    patch:
      tags: [Apps]
      summary: Enable or disable a catalog feed source.
      operationId: updateAppCatalogSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "platform.apps.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_enabled]
              properties:
                is_enabled:
                  type: boolean
      responses:
        "200":
          description: Catalog feed source
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/catalog/sources/{id}/sync:
    post:
      tags: [Apps]
      summary: Manually synchronize a catalog feed source.
      operationId: syncAppCatalogSource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "platform.apps.manage"
      responses:
        "200":
          description: Feed sync result
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/catalog/entries/{app_id}/install:
    post:
      tags: [Apps]
      summary: Install or stage an app from the local catalog.
      operationId: installCatalogEntry
      parameters:
        - $ref: "#/components/parameters/AppId"
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "platform.apps.manage"
        - "platform.apps.runtime.manage for mode=compose"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [external, stage_only, compose]
                  default: external
      responses:
        "201":
          description: Installed via external mode
        "202":
          description: Staged deployment plan
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Catalog manifest hash changed or app slug conflict
        "501":
          description: Core-managed compose runtime is not implemented yet

  /apps/catalog/entries/{app_id}/publication:
    patch:
      tags: [Apps]
      summary: Publish or unpublish an installed app in this instance feed.
      operationId: setCatalogEntryPublication
      parameters:
        - $ref: "#/components/parameters/AppId"
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "platform.apps.manage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [published]
              properties:
                published:
                  type: boolean
                note:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated catalog entry
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: App is not installed/enabled and cannot be published

  /apps/{slug}/entitlement:
    get:
      tags: [Apps]
      summary: Return resolved entitlement for app runtime.
      operationId: getResolvedAppEntitlement
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuthUser: []
      responses:
        "200":
          description: Resolved entitlement
        "204":
          description: No entitlement resolved
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/register:
    post:
      tags: [Apps]
      summary: Register an app version/manifest (platform admin only).
      operationId: registerApp
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "core.apps.register"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRegisterRequest"
      responses:
        "200":
          description: App registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/apps/{app_id}/enable:
    post:
      tags: [Apps]
      summary: Enable an app for current tenant (tenant admin only).
      operationId: enableAppForTenant
      parameters:
        - $ref: "#/components/parameters/AppId"
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "core.apps.enable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantAppEnableRequest"
      responses:
        "200":
          description: Enabled state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantAppState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/apps/{app_id}/disable:
    post:
      tags: [Apps]
      summary: Disable an app for current tenant (tenant admin only).
      operationId: disableAppForTenant
      parameters:
        - $ref: "#/components/parameters/AppId"
      security:
        - bearerAuthUser: []
      x-required-privileges:
        - "core.apps.disable"
      responses:
        "204":
          description: Disabled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /events/publish:
    post:
      tags: [Events]
      summary: Publish an event (app identity only).
      operationId: publishEvent
      security:
        - bearerAuthApp: []
      x-required-privileges: [] # app-auth only, no user privilege
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPublishRequest"
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPublishResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /events/consume:
    post:
      tags: [Events]
      summary: Consume next events for a consumer (app identity only).
      operationId: consumeEvents
      security:
        - bearerAuthApp: []
      x-required-privileges: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventConsumeRequest"
      responses:
        "200":
          description: Events batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventConsumeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /events/ack:
    post:
      tags: [Events]
      summary: Acknowledge processed events (app identity only).
      operationId: acknowledgeEvents
      security:
        - bearerAuthApp: []
      x-required-privileges: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventAckRequest"
      responses:
        "204":
          description: Acknowledged
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /audit/record:
    post:
      tags: [Audit]
      summary: Append an audit record (apps and core subsystems).
      operationId: recordAudit
      security:
        - bearerAuthApp: []
        - bearerAuthUser: []
      x-required-privileges:
        - "core.audit.append" # for user-auth; app-auth bypasses user privilege by definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditRecordRequest"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuthUser:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (human actor).
    bearerAuthApp:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: App identity token (service-to-core).

  # keep the rest of components (parameters/responses/schemas) from v0.1.0 unchanged
